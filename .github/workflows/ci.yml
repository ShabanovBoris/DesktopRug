name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify generated Xcode project
        run: |
          python3 scripts/generate_project.py
          git diff --exit-code -- DesktopRug.xcodeproj
          plutil -lint DesktopRug.xcodeproj/project.pbxproj DesktopRug/Info.plist DesktopRug/DesktopRug.entitlements
      - name: Test cloth simulation
        run: bash scripts/test.sh
      - name: Build and verify release archive
        run: |
          python3 scripts/build.py
          python3 scripts/package_release.py
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DesktopRug-macOS
          path: |
            build/release/*.zip
            build/release/*.sha256
          if-no-files-found: error
          retention-days: 14
